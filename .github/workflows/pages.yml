name: Strona

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Zależności
        run: npm ci

      - name: Testy
        run: npm test

      - name: Budowanie strony
        run: npm run build

      - name: Konfiguracja GitHub Pages
        uses: actions/configure-pages@v5

      - name: Wysłanie plików
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publikacja
        id: deployment
        uses: actions/deploy-pages@v4
